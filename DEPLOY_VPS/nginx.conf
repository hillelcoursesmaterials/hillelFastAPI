# ===========================
# Redirect HTTP → HTTPS
# ===========================
server {
    listen 80;
    listen [::]:80;
    server_name the-best-fastapi-project.online;

    return 301 https://the-best-fastapi-project.online$request_uri;
}

# ===========================
# HTTPS Load Balancing
# ===========================
upstream loadbalancer {
    least_conn;

    # NOT INNER DOCKER DNS!!!
    server 127.0.0.1:12345 weight=5 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:12346 weight=5 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name the-best-fastapi-project.online;

    # ---------------------------
    # SSL Certificates (Let's Encrypt)
    # ---------------------------
    ssl_certificate /etc/letsencrypt/live/the-best-fastapi-project.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/the-best-fastapi-project.online/privkey.pem;

    # ---------------------------
    # SSL settings
    # ---------------------------
    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        allow all;
    }

    # ---------------------------
    # Proxy forwarding
    # ---------------------------
    location / {
        proxy_pass http://loadbalancer;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        send_timeout 60s;
    }
}
